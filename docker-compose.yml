version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15674:15674" # Web STOMP
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    command: /bin/bash -c "rabbitmq-plugins enable rabbitmq_web_stomp && rabbitmq-server"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    volumes:
      - ./config.json:/usr/local/bin/config.json
      - ./secrets.json:/usr/local/bin/secrets.json
    restart: always

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

volumes:
  rabbitmq_data:
