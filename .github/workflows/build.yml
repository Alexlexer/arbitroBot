name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: arbit_hub_linux
            asset_name: arbit_hub
          - os: windows-latest
            artifact_name: arbit_hub_windows
            asset_name: arbit_hub.exe

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-deb (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: cargo install cargo-deb

    - name: Build
      run: cargo build --release --verbose

    - name: Package .deb (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: cargo deb

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: |
          target/release/${{ matrix.asset_name }}
          target/debian/*.deb

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: arbit_hub_windows
          path: ./release

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: arbit_hub_linux
          path: ./release

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./release/arbit_hub.exe
            ./release/arbit_hub
            ./release/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
