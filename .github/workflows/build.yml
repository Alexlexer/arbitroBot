name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: arbit_hub_linux
            asset_name: arbit_hub
          - os: windows-latest
            artifact_name: arbit_hub_windows
            asset_name: arbit_hub.exe

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-deb (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: cargo install cargo-deb

    - name: Build
      run: cargo build --release --verbose

    - name: Package .deb (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: cargo deb

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: |
          target/release/${{ matrix.asset_name }}
          target/debian/*.deb

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: arbit_hub_windows
          path: ./release

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: arbit_hub_linux
          path: ./release

      - name: Set Release Tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "name=Latest Build (Auto-updated)" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "tag=${github_ref#refs/tags/}" >> $GITHUB_OUTPUT
            echo "name=Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.name }}
          prerelease: ${{ steps.vars.outputs.prerelease }}
          files: |
            ./release/arbit_hub.exe
            ./release/arbit_hub
            ./release/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
