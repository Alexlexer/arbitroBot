# Nginx snippet: serve arbitroBot dashboard at https://your-server/arbitrobot
# Add this inside your existing server { } block, or include: include /opt/arbitroBot/deploy/nginx-arbitrobot.conf;

location /arbitrobot/ {
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# Optional: WebSocket for STOMP (dashboard live updates) – if 15674 is only on localhost
# location /arbitrobot-ws/ { ... }  # only if you want to proxy 15674 under a path; dashboard uses port 15674 directly by default
