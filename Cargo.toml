[package]
name = "arbit_hub"
version = "0.1.0"
edition = "2021"
description = "Multi-Exchange Arbitrage Hub"

[dependencies]
tokio = { version = "1.32", features = ["full"] }
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.4"
chrono = "0.4"
futures-util = "0.3"
rust_decimal = "1.32"
rust_decimal_macros = "1.32"
async-trait = "0.1"
crossterm = "0.27"
prettytable-rs = "0.10"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
env_logger = "0.10"
log = "0.4"
dotenvy = "0.15.7"

[package.metadata.deb]
maintainer = "AlexK <alex@example.com>"
section = "utility"
priority = "optional"
assets = [
    ["target/release/arbit_hub", "usr/bin/arbit_hub", "755"],
]
